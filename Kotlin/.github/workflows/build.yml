name: Build & Release APK

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: read

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Get version from build.gradle
      id: version
      run: |
        VERSION=$(grep "versionName" app/build.gradle.kts | awk -F'"' '{print $2}' | head -1)
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "VERSION=$VERSION"
        echo "Version: $VERSION"

    - name: Build Debug APK
      run: ./gradlew assembleDebug -x test --no-daemon --parallel
      working-directory: ./app

    - name: Build Release APK  
      run: ./gradlew assembleRelease -x test --no-daemon --parallel
      working-directory: ./app

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release-${{ env.VERSION }}
        path: app/build/outputs/apk/release/*.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: Release v${{ env.VERSION }}
        body: |
          ## Kotlin Cờ Tướng - Release v${{ env.VERSION }}

          ### 📦 Tải xuống
          - [app-release-${{ env.VERSION }}.apk](https://github.com/vuongtu1k9-ship-it/Kotlin/releases/download/v${{ env.VERSION }}/app-release-${{ env.VERSION }}.apk)

        files: |
          app/build/outputs/apk/release/*.apk
        draft: false
        prerelease: false

    - name: Update HEARTBEAT.md
      if: success()
      run: |
        cat > HEARTBEAT.md << 'EOF'
# HEARTBEAT.md

## 🚀 Cờ Tướng Kotlin
- **Version**: v${{ env.VERSION }}
- **Status**: ✅ Build Success
- **Build**: ${{ github.sha }}
EOF
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add HEARTBEAT.md
        git commit -m "chore: update HEARTBEAT.md [skip ci]"
        git push origin main