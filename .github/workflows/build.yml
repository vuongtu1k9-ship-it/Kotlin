name: Build & Release APK

on:
  push:
    branches: [ "cotuong" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "cotuong" ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission
      run: chmod +x gradlew

    - name: Get version from build.gradle.kts
      id: version
      run: |
        VERSION=$(grep "versionName" app/build.gradle.kts | sed -E 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/')
        if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Version detected: $VERSION"

    - name: Build Release APK
      run: ./gradlew assembleRelease -x test --no-daemon --parallel --build-cache

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-release-${{ env.VERSION }}
        path: app/build/outputs/apk/release/*.apk

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/cotuong'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: Release v${{ env.VERSION }}
        body: |
          ## Cờ Tướng - Release v${{ env.VERSION }}

          ### 📦 Tải xuống APK
          - [app-release-${{ env.VERSION }}.apk](https://github.com/vuongtu1k9-ship-it/Kotlin/releases/download/v${{ env.VERSION }}/app-release-${{ env.VERSION }}.apk)

          ### ✨ Tính năng
          - AI đánh cờ tướng (minimax, alpha-beta pruning)
          - Luật cờ tướng đầy đủ
          - Undo (quay lại 3 nước)

          ### 🔧 Cải tiến
          - Version: ${{ env.VERSION }}
          - Built on: ${{ github.sha }}

        files: |
          app/build/outputs/apk/release/*.apk
        draft: false
        prerelease: false
