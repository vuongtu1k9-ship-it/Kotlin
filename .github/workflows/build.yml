name: Android CI

on:
  push:
    branches: [ "cotuong" ]
  pull_request:
    branches: [ "cotuong" ]

jobs:
  build:
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ Cache Gradle (quan trọng nhất để nhanh)
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}

      # ✅ Setup JDK (Java 17 là chuẩn cho Android mới)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      # ✅ Permission cho gradlew
      - name: Grant execute permission
        run: chmod +x gradlew

      # ✅ Build nhanh (skip test nếu cần)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --parallel --build-cache

      # ✅ Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk