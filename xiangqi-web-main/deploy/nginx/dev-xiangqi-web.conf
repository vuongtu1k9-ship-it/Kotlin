# dev.cotuong.xyz - Parallel Development Environment
# Note: Behind Varnish/CDN — WebSocket upgrade headers must be passed through correctly.

upstream xiangqi_dev_backend {
  server 127.0.0.1:3001;
  keepalive 32;
}

# HTTP — behind CDN (Varnish) edge
# Issue #149: Direct 301 redirect causes loop (CDN→origin:80→301→CDN→loop).
# Fix #144: Redirect based on X-Forwarded-Proto — CDN sets this to "http"
# when client connects via HTTP. If header absent (direct origin access), also redirect.
# Health check and API/socket bypass the redirect via exact/prefix location blocks.
server {
  listen 80;
  server_name dev.cotuong.xyz *.dev.cotuong.xyz;
  client_max_body_size 100M;

  # Security headers (Issue #146) — add here so CDN can forward them
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  root /var/www/xiangqi-web-dev/current/dist;
  index index.html;

  # Health Check — bypass redirect (used by CDN/monitoring on port 80)
  location = /health {
    proxy_pass http://xiangqi_dev_backend/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    access_log off;
  }

  # Backend: Sitemaps
  location ~ /sitemap.*\.xml$ {
    proxy_pass http://xiangqi_dev_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
  }

  # Backend API — bypass redirect (CDN may proxy API via HTTP)
  location ^~ /api/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://xiangqi_dev_backend;
  }

  # Socket.io — bypass redirect (WebSocket needs persistent HTTP)
  location ^~ /socket.io/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket-specific timeouts (longer for game sessions)
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Disable buffering for real-time
    proxy_buffering off;

    # Keep connections alive
    keepalive_timeout 300s;

    proxy_pass http://xiangqi_dev_backend;
  }

  # Issue #144 + #149: HTTP→HTTPS redirect for browser traffic
  # CDN sets X-Forwarded-Proto=http when client connects via HTTP
  # → nginx returns 301, CDN caches it, clients upgrade to HTTPS
  # Direct access without header also redirects
  location = /favicon.ico {
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }
    if ($http_x_forwarded_proto = "") { return 301 https://$host$request_uri; }
    log_not_found off;
    access_log off;
    try_files /favicon.ico =404;
  }

  location / {
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }
    if ($http_x_forwarded_proto = "") { return 301 https://$host$request_uri; }

    # If it's a bot, go to backend to get dynamic meta tags
    set $is_bot "";
    if ($http_user_agent ~* "(facebookexternalhit|twitterbot|googlebot|bingbot|linkedinbot|whatsapp|viber|telegrambot|bot|opengraph|crawler|spider|checker)") {
        set $is_bot "1";
    }
    if ($http_user_agent ~* "Lighthouse") {
        set $is_bot "";
    }
    if ($is_bot = "1") {
        proxy_pass http://xiangqi_dev_backend;
    }

    try_files $uri $uri/ /index.html;
  }

  # Static Assets
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|mp4)$ {
    add_header X-Antigravity-Source "nginx-static-80" always;
    try_files $uri @proxy;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
  }
}

# HTTPS
server {
  listen 443 ssl http2;
  server_name dev.cotuong.xyz *.dev.cotuong.xyz;
  client_max_body_size 100M;

  ssl_certificate     /etc/ssl/certs/cotuong.xyz.crt;
  ssl_certificate_key /etc/ssl/private/cotuong.xyz.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  # Security headers (Issue #146)
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  root /var/www/xiangqi-web-dev/current/dist;
  index index.html;

  # Health Check
  location = /health {
    proxy_pass http://xiangqi_dev_backend/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    access_log off;
  }

  # Backend API
  location ^~ /api/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://xiangqi_dev_backend;
  }

  # Socket.io
  location ^~ /socket.io/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket-specific timeouts (longer for game sessions)
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Disable buffering for real-time
    proxy_buffering off;

    proxy_pass http://xiangqi_dev_backend;
  }

  location @proxy {
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $http_host;
    proxy_set_header X-NginX-Proxy true;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://xiangqi_dev_backend;
  }

  # Redirects (Issue #SEO)
  rewrite ^/co-the$ /puzzles permanent;
  rewrite ^/choi-thu$ /ai permanent;
  rewrite ^/ban-html$ /games permanent;

  # SPA Root
  location = /favicon.ico {
    log_not_found off;
    access_log off;
    try_files /favicon.ico =404;
  }

  location / {
    # If it's a bot, go to backend to get dynamic meta tags
    set $is_bot "";
    if ($http_user_agent ~* "(facebookexternalhit|twitterbot|googlebot|bingbot|linkedinbot|whatsapp|viber|telegrambot|bot|opengraph|crawler|spider|checker)") {
        set $is_bot "1";
    }
    if ($http_user_agent ~* "Lighthouse") {
        set $is_bot "";
    }
    if ($is_bot = "1") {
        proxy_pass http://xiangqi_dev_backend;
    }

    try_files $uri $uri/ @proxy;
  }

  # Static Assets
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|mp4)$ {
    add_header X-Antigravity-Source "nginx-static-443" always;
    error_page 404 = @proxy;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  location @proxy {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://xiangqi_dev_backend;
  }
}
