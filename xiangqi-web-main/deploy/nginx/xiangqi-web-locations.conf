# Redirects (Issue #SEO)
rewrite ^/co-the$ /puzzles permanent;
rewrite ^/choi-thu$ /ai permanent;
rewrite ^/ban-html$ /games permanent;

# --- 0. BOT DETECTION (GLOBAL) ---
set $is_bot 0;
if ($http_user_agent ~* (facebookexternalhit|twitterbot|googlebot|bingbot|linkedinbot|whatsapp|viber|telegrambot|bot|opengraph|node|axios|fetch|meta-externalagent)) {
    set $is_bot 1;
}

# --- 1. SPECIAL ASSETS: Dynamic Logic (REGEX FIRST) ---

# Dynamic Board Images (.png)
location ~* ^/uploads/(games|puzzles)/(.*)\.png$ {
  root /data/xiangqi;
  try_files $uri @image_gen;
}

location @image_gen {
  if ($uri ~* "/uploads/games/") { rewrite ^/uploads/games/(.*)\.png$ /api/export/image/game/$1 break; }
  if ($uri ~* "/uploads/puzzles/") { rewrite ^/uploads/puzzles/(.*)\.png$ /api/export/image/puzzle/$1 break; }
  
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_pass http://xiangqi_backend;
}

# Dynamic Move Videos (.mp4)
location ~* ^/uploads/videos/(game|puzzle)-(.*)\.mp4$ {
  root /data/xiangqi;
  try_files $uri @video_gen;
}

location @video_gen {
  rewrite ^/uploads/videos/(game|puzzle)-(.*)\.mp4$ /api/export/video-gen/$1-$2.mp4 break;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_pass http://xiangqi_backend;
}

# --- 2. REGULAR ASSETS: Static Serving ---

location = /sitemap.xml {
  proxy_set_header Host $host;
  proxy_pass http://xiangqi_backend/sitemap.xml;
}

location = /health {
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_pass http://xiangqi_backend/health;
}

location /api/ {
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  rewrite ^/api/(.*)$ /$1 break;
  proxy_pass http://xiangqi_backend;
}

location ^~ /socket.io/ {
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_pass http://xiangqi_backend;
}

location /uploads/ {
  root /data/xiangqi;
  expires 30d;
  add_header Cache-Control "public, max-age=2592000";
  try_files $uri $uri/ =404;
}

# --- 3. FRONTEND: SPA & SEO ---

root /var/www/xiangqi-web/current/dist;
index index.html;

# Named location for SEO Bot Proxy
location @seo_bot_proxy {
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://xiangqi_backend;
}

location / {
    # If it is a known crawler, intercept and proxy to backend
    if ($is_bot = 1) {
        error_page 418 = @seo_bot_proxy;
        return 418;
    }
    try_files $uri $uri/ /index.html;
}

location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
  expires 30d;
  add_header Cache-Control "public, max-age=2592000, immutable";
}
