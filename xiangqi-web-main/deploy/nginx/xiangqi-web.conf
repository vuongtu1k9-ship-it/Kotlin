# xiangqi-web - nginx site
#
# - Serves Vite build from /var/www/xiangqi-web/current/dist
# - Proxies backend (Node/Express + Socket.io) on 127.0.0.1:3001
#   - /api/*       -> backend
#   - /socket.io/* -> backend (socket.io default path)
#   - /health      -> backend
#
# Adjust server_name, TLS, and paths for your environment.

upstream xiangqi_backend {
  server 127.0.0.1:3001;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  client_max_body_size 100M;

  root /var/www/xiangqi-web/current/dist;
  index index.html;

  # Required for Google Sign-In One Tap / Popups
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  # Recommended: increase for large headers/cookies if needed
  # large_client_header_buffers 4 16k;

  # ---- Backend: sitemaps ----
  location ~ /sitemap.*\.xml$ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://xiangqi_backend;
  }

  # ---- Backend: health ----
  location = /health {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://xiangqi_backend/health;
  }

  # ---- Backend: REST APIs ----
  # Frontend expects same-origin APIs under /api
  location ^~ /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_pass http://xiangqi_backend;
  }

  # ---- Backend: Socket.io ----
  location ^~ /socket.io/ {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    proxy_pass http://xiangqi_backend;
  }

  # If you want to expose socket.io under /socket/ instead, you can rewrite:
  # location ^~ /socket/ {
  #   rewrite ^/socket/(.*)$ /socket.io/$1 break;
  #   proxy_pass http://xiangqi_backend;
  # }

  # Redirects (Issue #SEO)
  rewrite ^/co-the$ /puzzles permanent;
  rewrite ^/choi-thu$ /ai permanent;
  rewrite ^/ban-html$ /games permanent;

  # Basic caching for immutable assets (Vite typically fingerprints)
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|mp4)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri @proxy;
  }

  # ---- Frontend: SPA ----
  location / {
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Important: Do not cache the entry index.html so users get new asset hashes immediately
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;

    # If it's a bot, go to backend to get dynamic meta tags
    if ($http_user_agent ~* "facebookexternalhit|facebook|facebot|twitterbot|googlebot|bingbot|linkedinbot|whatsapp|viber|telegrambot|bot|opengraph|node|axios|fetch|crawler|spider|checker|validator|preview|inspect|parse|slurp|yandex") {
        proxy_pass http://xiangqi_backend;
    }

    try_files $uri $uri/ @proxy;
  }


  location @proxy {
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://xiangqi_backend;
  }
}
