# HTTP (no redirect) - avoids TLS/certificate issues on internal hosts file setups
server {
  listen 80;
  # Include dev.cotuong.xyz here if you want the same deployment to answer both prod and dev hosts.
  server_name cotuong.xyz www.cotuong.xyz dev.cotuong.xyz;
  client_max_body_size 100M;

  # Baseline security headers (Issue #50)
  # Note: CSP is intentionally permissive enough for React inline styles and Google OAuth.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "accelerometer=(), ambient-light-sensor=(), autoplay=(), battery=(), camera=(), clipboard-read=(), clipboard-write=(), cross-origin-isolated=(), display-capture=(), document-domain=(), encrypted-media=(), execution-while-not-rendered=(), execution-while-out-of-viewport=(), fullscreen=*, geolocation=(), gyroscope=(), hid=(), identity-credentials-get=(), idle-detection=(), interest-cohort=(), local-fonts=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=*, publickey-credentials-get=(), screen-wake-lock=(), serial=(), speaker-selection=(), usb=(), web-share=(), xr-spatial-tracking=()" always;
  add_header X-Frame-Options "DENY" always;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; media-src 'self' https://static.cotuong.xyz; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; script-src 'self' 'unsafe-inline' https://accounts.google.com https://apis.google.com https://www.googletagmanager.com; frame-src 'self' https://accounts.google.com https://www.youtube.com https://youtube.com; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com https://www.googleapis.com https://ws.cotuong.xyz wss://ws.cotuong.xyz https://www.google-analytics.com; upgrade-insecure-requests" always;
 
  # Gzip Optimization
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

  # Legacy /app paths
  location = /app { return 301 /; }
  location = /app/ { return 301 /; }
  location ^~ /app/ {
    rewrite ^/app/(.*)$ /$1 permanent;
  }

  # Redirects (Issue #SEO)
  rewrite ^/co-the$ /puzzles permanent;
  rewrite ^/choi-thu$ /ai permanent;
  rewrite ^/ban-html$ /games permanent;

  # Backend: Health Check
  location = /health {
    proxy_pass http://127.0.0.1:3001/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    access_log off;
  }

  # Backend: Sitemaps (Catch all sitemap XML files)
  location ~ /sitemap.*\.xml$ {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
  }
 
  # Backend API
  location /api {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Socket.io
  location /socket.io/ {
    proxy_pass http://127.0.0.1:3001/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # SPA
  root /var/www/xiangqi-web/current/dist;
  index index.html;

  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location /pieces/ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location = /favicon.ico {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  location / {
    # If it's a bot, go to backend to get dynamic meta tags
    if ($http_user_agent ~* "facebookexternalhit|facebook|facebot|twitterbot|googlebot|bingbot|linkedinbot|whatsapp|viber|telegrambot|bot|opengraph|node|axios|fetch|crawler|spider|checker|validator|preview|inspect|parse|slurp|yandex") {
        proxy_pass http://127.0.0.1:3001;
    }
    try_files $uri $uri/ /index.html;
  }
}

