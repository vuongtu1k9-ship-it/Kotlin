# File: /etc/haproxy/haproxy.cfg
# ====================================================================
# HANOI SERVER HAProxy CONFIGURATION - OPTIMIZED (2026)
# ====================================================================

global
    log 127.0.0.1 len 2048 local2
    log-send-hostname
    chroot /var/lib/haproxy
    user haproxy
    group haproxy
    daemon
    setcap cap_net_bind_service
    limited-quic

    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

    # ===== Performance =====
    maxconn 50000
    nbthread 8
    cpu-map auto:1/1-8 0-7

    tune.maxaccept 100
    tune.bufsize 32768
    tune.maxrewrite 4096

    # TLS (TLS 1.3 only)
    tune.ssl.default-dh-param 2048
    ssl-default-bind-options ssl-min-ver TLSv1.3 no-tls-tickets
    ssl-default-bind-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

    # ===== CrowdSec =====
    httpclient.ssl.verify none
    httpclient.resolvers.id my_resolver
    
    lua-prepend-path /usr/lib/crowdsec-haproxy-spoa-bouncer/lua/?.lua
    lua-load /usr/lib/crowdsec-haproxy-spoa-bouncer/lua/crowdsec.lua
    setenv CROWDSEC_BAN_TEMPLATE_PATH /var/lib/crowdsec-haproxy-spoa-bouncer/html/ban.html
    setenv CROWDSEC_CAPTCHA_TEMPLATE_PATH /var/lib/crowdsec-haproxy-spoa-bouncer/html/captcha.html

# ====================================================================
# DNS
# ====================================================================
resolvers my_resolver
    nameserver ns1 192.168.80.1:53
    hold valid 10s

# ====================================================================
# PEERS (CrowdSec sync)
# ====================================================================
peers hapeer
    peer Haproxy210pv 192.168.80.210:1411
    peer Haproxy211pv 192.168.80.211:1411
    peer Haproxy212pv 192.168.80.212:1411
    peer Haproxy213pv 192.168.80.213:1411
    peer Haproxy214v6pv 192.168.80.214:1411
    peer Haproxy215v6pv 192.168.80.215:1411

# ====================================================================
# DEFAULTS
# ====================================================================
defaults
    log global
    mode http
    option http-keep-alive
    option redispatch
    option dontlognull
    option log-health-checks

    timeout connect 5s
    timeout client  600s
    timeout server  600s
    timeout http-request 10s
    timeout http-keep-alive 15s
    timeout check   5s

    # Standard log format with captures
    log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %hr %hs %{+Q}r %fi:%fp trust:%[src_get_gpt0(haproxy-main)]"

    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

    option persist

# ====================================================================
# STATS
# ====================================================================
listen stats
    bind :8880
    stats enable
    http-request use-service prometheus-exporter if { path /metrics }
    stats uri /
    stats refresh 10s

# ====================================================================
# MAIN FRONTEND (HTTP + HTTPS + QUIC)
# ====================================================================
frontend haproxy-main
    # Bindings
    bind :80
    bind :::80
    bind :443 ssl crt /etc/ssl/private/ alpn h2,http/1.1
    bind :::443 ssl crt /etc/ssl/private/ alpn h2,http/1.1
    bind quic4@:443 ssl crt /etc/ssl/private/ alpn h3
    bind quic6@:443 ssl crt /etc/ssl/private/ alpn h3

    mode http
    option forwardfor
    option http-buffer-request
    
    # Enable logging
    log global

    # Headers Captures (Essential for log-format %hr)
    capture request header Host len 40
    capture request header User-Agent len 200
    capture request header Referer len 80
    capture request header X-Forwarded-For len 40
    capture response header Location len 120

    # Shared stick-table for tracking trusted IPs
    stick-table type ip size 1m expire 30m peers hapeer store gpt0,http_req_rate(60s)
    http-request track-sc0 src
    
    # Mark IP as trusted (gpt0=1) if captcha status is valid
    http-request sc-set-gpt0(0) 1 if { var(txn.crowdsec.captcha_status) -m str valid }

    # ===== Real IP extraction =====
    http-request set-var(txn.real_ip) hdr_ip(X-Real-IP) if { req.hdr(X-Real-IP) -m found }
    http-request set-var(txn.real_ip) hdr_ip(CF-Connecting-IP) if !{ var(txn.real_ip) -m found } { req.hdr(CF-Connecting-IP) -m found }
    http-request set-var(txn.real_ip) hdr_ip(X-Forwarded-For) if !{ var(txn.real_ip) -m found } { req.hdr(X-Forwarded-For) -m found }
    http-request set-src var(txn.real_ip) if { var(txn.real_ip) -m found }

    http-request add-header X-Forwarded-Proto https if { ssl_fc }

    # Skip CrowdSec SPOE if IP is already trusted
    acl is_trusted src_get_gpt0(haproxy-main) eq 1
    
    # ===== CrowdSec SPOE =====
    filter spoe engine crowdsec config /etc/haproxy/crowdsec.cfg
    
    acl body_ok req.body_size -m int le 51200
    acl has_body req.body_size -m found
    
    http-request send-spoe-group crowdsec crowdsec-http-body if !is_trusted body_ok
    http-request send-spoe-group crowdsec crowdsec-http-body if !is_trusted !has_body
    http-request send-spoe-group crowdsec crowdsec-http-no-body if !is_trusted !body_ok has_body

    http-request set-header X-Crowdsec-Remediation %[var(txn.crowdsec.remediation)]
    http-request redirect code 302 location %[url] if { var(txn.crowdsec.remediation) -m str allow } { var(txn.crowdsec.redirect) -m found }
    http-request lua.crowdsec_handle if { var(txn.crowdsec.remediation) -m reg ^(captcha|ban)$ }

    http-after-response set-header Set-Cookie %[var(txn.crowdsec.captcha_cookie)] if { var(txn.crowdsec.captcha_status) -m found } { var(txn.crowdsec.captcha_cookie) -m found }
    http-after-response set-header Set-Cookie %[var(txn.crowdsec.captcha_cookie)] if { var(txn.crowdsec.captcha_cookie) -m found } !{ var(txn.crowdsec.captcha_status) -m found }

    # ===== HTTP/3 Discovery =====
    http-response set-header Alt-Svc 'h3=":443"; ma=604800; persist=1' if { ssl_fc }
    http-response set-header X-HTTP3-VERSION "h3" if { ssl_fc_alpn -i h3 }

    # ===== Routing =====
    acl tuongthuat_paths path_beg /zzz /p-s /rss-feed /gateway/ttsa /tttt /ptttt /amp-tt
    acl chatgpt_paths    path_beg /conversation /process-audio /text-to-speech
    acl chatgpt_api      path_beg /openai
    acl txt2img_paths    path_beg /txt2img
    acl node_socket      path_beg /socket.io

    acl node_domain      hdr_dom(host) -i njs.xskt.com.vn
    acl stt_opnai        hdr_dom(host) -i stt.opnai.net
    acl dev_cotuong      hdr_dom(host) -i dev.cotuong.xyz
    acl prod_cotuong     hdr_dom(host) -i cotuong.xyz

    use_backend nodejs-dev-socket if node_socket dev_cotuong
    use_backend nodejs-prod-socket if node_socket prod_cotuong

    use_backend tuongthuat     if tuongthuat_paths
    use_backend textgen        if chatgpt_api
    use_backend chatgpt        if chatgpt_paths
    use_backend txt2img        if txt2img_paths
    use_backend nodejs-socket  if node_socket
    use_backend nodejs-api     if node_domain
    use_backend stt-opnai      if stt_opnai

    default_backend varnish

# ====================================================================
# BACKENDS
# ====================================================================
backend nodejs-dev-socket
    server nodevp23 192.168.1.23:3001 check
backend nodejs-prod-socket
    server nodevp23 192.168.80.139:3001 check

backend varnish
    balance roundrobin
    option http-keep-alive
    option httpchk HEAD /varnish-status
    default-server inter 5s rise 2 fall 3 fastinter 1s downinter 10s

    server varnishlocal /run/varnish/varnish.sock check weight 60
    server varnish110 192.168.80.210:6081 check weight 10
    server varnish111 192.168.80.211:6081 check weight 10
    server varnish112 192.168.80.212:6081 check weight 10
    server varnish113 192.168.80.213:6081 check weight 10
    server varnish114 192.168.80.214:6081 check weight 10
    server varnish115 192.168.80.215:6081 check weight 10
    server varnishsg  192.168.9.210:6081 check backup slowstart 30s

backend nodejs-socket
    balance source
    hash-type consistent
    option forwardfor
    timeout server  120s
    option httpchk GET /health
    default-server inter 5s rise 2 fall 3 fastinter 1s downinter 10s
    server hn141 192.168.80.141:8080 check
    server hn142 192.168.80.142:8080 check
    server hn143 192.168.80.143:8080 check
    server hn144 192.168.80.144:8080 check
    server hn145 192.168.80.145:8080 check
    server hn146 192.168.80.146:8080 check
    server bk135 192.168.9.135:8080 check backup
    server bk136 192.168.9.136:8080 check backup
    server bk137 192.168.9.137:8080 check backup
    server bk138 192.168.9.138:8080 check backup
    server bk139 192.168.9.139:8080 check backup

backend nodejs-api
    balance leastconn
    option forwardfor
    timeout server  120s
    option httpchk GET /health
    default-server inter 5s rise 2 fall 3 fastinter 1s downinter 10s
    server hn141 192.168.80.141:8080 check
    server hn142 192.168.80.142:8080 check
    server hn143 192.168.80.143:8080 check
    server hn144 192.168.80.144:8080 check
    server hn145 192.168.80.145:8080 check
    server hn146 192.168.80.146:8080 check
    server bk135 192.168.9.135:8080 check backup
    server bk136 192.168.9.136:8080 check backup
    server bk137 192.168.9.137:8080 check backup
    server bk138 192.168.9.138:8080 check backup
    server bk139 192.168.9.139:8080 check backup


backend tuongthuat
    balance roundrobin
    option forwardfor
    # Shared stick-table for global rate limiting
    stick-table type ip size 10m expire 5m peers hapeer store http_req_rate(60s)
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 30 }
    server varnishlocal /run/varnish/varnish.sock check weight 60
    server varnish110 192.168.80.210:6081 check weight 10
    server varnish111 192.168.80.211:6081 check weight 10
    server varnish112 192.168.80.212:6081 check weight 10
    server varnish113 192.168.80.213:6081 check weight 10
    server varnish114 192.168.80.214:6081 check weight 10
    server varnish115 192.168.80.215:6081 check weight 10
    server varnishsg  192.168.9.210:6081 check backup

backend txt2img
    timeout server 4m
    option httpchk GET /health
    server sd233pv2 192.168.80.233:4002 check

backend textgen
    timeout server 4m
    option httpchk GET /health
    server chatgpt233tpv 192.168.80.233:5001 check

backend chatgpt
    balance leastconn
    timeout server 4m
    option httpchk GET /health
    server chatgpt2335pv 192.168.80.233:5001 check

backend stt-opnai
    timeout connect 5s
    timeout server 4m
    option forwardfor
    server tts 192.168.80.246:8765 weight 80 check inter 5s

backend crowdsec-spoa
    mode tcp
    server s1 127.0.0.1:9000
