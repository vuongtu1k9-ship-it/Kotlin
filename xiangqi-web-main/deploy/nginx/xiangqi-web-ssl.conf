upstream xiangqi_backend {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name cotuong.xyz www.cotuong.xyz;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name cotuong.xyz www.cotuong.xyz;

  ssl_certificate /etc/ssl/certs/cotuong.xyz.crt;
  ssl_certificate_key /etc/ssl/private/cotuong.xyz.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  include /etc/nginx/xiangqi-web-locations.conf;
}
