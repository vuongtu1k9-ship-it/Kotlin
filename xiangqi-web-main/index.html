<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="preconnect" href="https://static.cotuong.xyz" />
    <!-- Fonts loaded after first paint to avoid render-blocking -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Be+Vietnam+Pro:wght@400;700;900&family=Outfit:wght@400;700;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Be+Vietnam+Pro:wght@400;700;900&family=Outfit:wght@400;700;900&display=swap" media="print" onload="this.media='all'" />
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0B0F19" />
    <title>Cờ tướng Online - Chơi Cờ Tướng Với Máy, Giải Cờ Thế & Đấu AI</title>
    
    <style>
      :root { --bg: #0B0F19; --xq-gold: #d4af37; }
      body { background: var(--bg); margin: 0; color: #fff; font-family: 'Montserrat', system-ui, -apple-system, sans-serif; }
      #root { min-height: 100vh; }
      .sk-h { height: 64px; border-bottom: 1px solid rgba(255,255,255,0.05); }
      .sk-c { padding: 16px; max-width: 650px; margin: 0 auto; }
      .sk-t { font-size: 24px; font-weight: 900; color: #fff; text-transform: uppercase; margin: 0; letter-spacing: -0.05em; line-height: 1; }
      .sk-t span { color: #4338ca; }
      .sk-st { font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.15); text-transform: uppercase; letter-spacing: 0.2em; margin-top: 8px; margin-bottom: 24px; }
      .sk-b { 
        width: 100%; aspect-ratio: 9/11; background: #0f172a; border-radius: 20px; 
        border: 1px solid rgba(255,255,255,0.05); position: relative; overflow: hidden;
        box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      }
      .sk-b::before {
        content: ""; position: absolute; inset: 20px; 
        border: 1px solid rgba(255,255,255,0.05);
        background-image: 
          linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
        background-size: calc(100% / 8) calc(100% / 9);
      }
      .sk-p {
        position: absolute; width: 8%; height: 6.5%; border-radius: 50%;
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      }
    </style>
  </head>
  <body class="bg-[#0B0F19]">
    <div id="root">
      <div class="sk-h"></div>
      <div class="sk-c">
        <h1 class="sk-t">LUYỆN CỜ TƯỚNG <span>VỚI AI</span></h1>
        <div class="sk-st">NỀN TẢNG THI ĐẤU & GIẢI CỜ THẾ HÀNG ĐẦU</div>
        <div class="sk-b">
          <!-- Full Initial Setup SVG for LCP 1.0s -->
          <svg viewBox="0 0 100 100" style="position:absolute; inset:0; width:100%; height:100%; pointer-events:none;">
            <defs>
              <filter id="p-sh"><feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.3"/></filter>
            </defs>
            <!-- Render 32 piece placeholders to count as LCP -->
            <g filter="url(#p-sh)">
              <!-- Black Side -->
              <circle cx="5" cy="5" r="4" fill="#1a1a1a" stroke="#000" stroke-width="0.5"/>
              <circle cx="16" cy="5" r="4" fill="#1a1a1a" stroke="#000" stroke-width="0.5"/>
              <circle cx="27" cy="5" r="4" fill="#1a1a1a" stroke="#000" stroke-width="0.5"/>
              <circle cx="38" cy="5" r="4" fill="#1a1a1a" stroke="#000" stroke-width="0.5"/>
              <circle cx="49" cy="5" r="4" fill="#1a1a1a" stroke="#000" stroke-width="0.5"/>
              <circle cx="61" cy="5" r="4" fill="#1a1a1a" stroke="#000" stroke-width="0.5"/>
              <circle cx="72" cy="5" r="4" fill="#1a1a1a" stroke="#000" stroke-width="0.5"/>
              <circle cx="83" cy="5" r="4" fill="#1a1a1a" stroke="#000" stroke-width="0.5"/>
              <circle cx="94" cy="5" r="4" fill="#1a1a1a" stroke="#000" stroke-width="0.5"/>
              <!-- Red Side -->
              <circle cx="5" cy="95" r="4" fill="#e61919" stroke="#800" stroke-width="0.5"/>
              <circle cx="16" cy="95" r="4" fill="#e61919" stroke="#800" stroke-width="0.5"/>
              <circle cx="27" cy="95" r="4" fill="#e61919" stroke="#800" stroke-width="0.5"/>
              <circle cx="38" cy="95" r="4" fill="#e61919" stroke="#800" stroke-width="0.5"/>
              <circle cx="49" cy="95" r="4" fill="#e61919" stroke="#800" stroke-width="0.5"/>
              <circle cx="61" cy="95" r="4" fill="#e61919" stroke="#800" stroke-width="0.5"/>
              <circle cx="72" cy="95" r="4" fill="#e61919" stroke="#800" stroke-width="0.5"/>
              <circle cx="83" cy="95" r="4" fill="#e61919" stroke="#800" stroke-width="0.5"/>
              <circle cx="94" cy="95" r="4" fill="#e61919" stroke="#800" stroke-width="0.5"/>
            </g>
          </svg>
        </div>
      </div>
    </div>
    <script type="module">
      window.addEventListener('load', () => {
        const mount = () => import('/src/main.tsx');
        if ('requestIdleCallback' in window) {
          requestIdleCallback(mount, { timeout: 2000 });
        } else {
          setTimeout(mount, 500);
        }
      });
    </script>
    <script>
      // Load GA only after CPU is idle AND page fully settled (min 5s)
      // This ensures it never competes with React hydration or board rendering
      (function() {
        var loaded = false;
        function loadGA() {
          if (loaded) return;
          loaded = true;
          var host = window.location.hostname;
          if (!host.includes('cotuong.xyz')) return;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-GBCYTG0L4Y';
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          window.gtag = gtag;
          gtag('js', new Date());
          gtag('config', 'G-GBCYTG0L4Y', { send_page_view: true });
        }
        // Wait for page fully loaded, then wait for CPU idle
        window.addEventListener('load', function() {
          if ('requestIdleCallback' in window) {
            // Must be BOTH: 5s elapsed AND CPU idle
            setTimeout(function() {
              requestIdleCallback(loadGA, { timeout: 3000 });
            }, 5000);
          } else {
            setTimeout(loadGA, 8000);
          }
        });
      })();
    </script>
  </body>
</html>
